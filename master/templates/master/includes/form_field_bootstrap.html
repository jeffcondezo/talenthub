<div class="{{ col|default:'col-md-6' }}">
    <div class="form-group">
        <label for="{{ field.id_for_label }}" class="form-label">{{ label }}</label>
        {{ field }}
        {% if field.errors %}
        <div class="text-danger">
            {% for error in field.errors %}
            <small>{{ error }}</small>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</div>
