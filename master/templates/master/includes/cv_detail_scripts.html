    function bindExperienciaLaboralForm(experienciaId) {

        });

    function handleExperienciaSaveError(xhr, experienciaId) {
        if (xhr.status === 400 && xhr.responseText && xhr.responseText.indexOf('experienciaLaboralForm') !== -1) {
            $('#experienciaLaboralModalBody').html(xhr.responseText);
            bindExperienciaLaboralForm(experienciaId);
            showToast('Revise los errores marcados en el formulario', 'error');
            return;
        }

        let message = 'Error al guardar la experiencia laboral';
        try {
            const data = JSON.parse(xhr.responseText);
            if (data.errors) {
                const parts = [];
                Object.keys(data.errors).forEach(function(field) {
                    parts.push(data.errors[field].join(', '));
                });
                if (parts.length) {
                    message = parts.join('. ');
                }
            }
        } catch (e) {
            // respuesta no JSON
        }
        showToast(message, 'error');
    }

    window.showToast = function(message, type, duration) {
        type = type || 'success';
        duration = duration || 4000;
        const toastContainer = document.getElementById('toastContainer');
        const toastId = 'toast-' + Date.now();
        const iconClass = type === 'success' ? 'fal fa-check-circle' : 'fal fa-exclamation-triangle';
        const toastClass = type === 'success' ? 'toast-success' : 'toast-error';
        const title = type === 'success' ? 'Éxito' : 'Error';

        toastContainer.insertAdjacentHTML('beforeend', `
            <div class="toast ${toastClass}" id="${toastId}">
                <div class="toast-header">
                    <i class="${iconClass} toast-icon"></i>
                    <strong>${title}</strong>
                    <button type="button" class="toast-close" onclick="hideToast('${toastId}')">&times;</button>
                </div>
                <div class="toast-body">${message}</div>
            </div>
        `);

        setTimeout(function() {
            document.getElementById(toastId).classList.add('show');
        }, 100);
        setTimeout(function() {
            hideToast(toastId);
        }, duration);
    };

    window.hideToast = function(toastId) {
        const toast = document.getElementById(toastId);
        if (!toast) return;
        toast.classList.remove('show');
        setTimeout(function() {
            if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
            }
        }, 300);
    };

    window.showPersistentToast = function(message, type, duration) {
        type = type || 'success';
        duration = duration || 6000;
        localStorage.setItem('pendingToast', JSON.stringify({
            message: message,
            type: type,
            duration: duration,
            timestamp: Date.now()
        }));
        showToast(message, type, duration);
    };

    window.showPendingToasts = function() {
        const pendingToast = localStorage.getItem('pendingToast');
        if (!pendingToast) return;
        try {
            const toastData = JSON.parse(pendingToast);
            if (Date.now() - toastData.timestamp < 10000) {
                showToast(toastData.message, toastData.type, toastData.duration);
            }
        } catch (e) {
            console.error('Error al mostrar toast pendiente:', e);
        } finally {
            localStorage.removeItem('pendingToast');
        }
    };

    document.addEventListener('DOMContentLoaded', function() {
        showPendingToasts();
    });
