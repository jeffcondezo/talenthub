{% extends 'master/includes/base.html' %}
{% load static %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="container-fluid persona-edit-page">
    <div class="panel-talent" style="max-width:560px;margin:40px auto;">
        <h6 class="section-title-talent mb-3"><i class="fal fa-trash-alt mr-2 text-danger"></i> {{ titulo }}</h6>
        <p>{{ mensaje }}</p>
        <form method="post" class="d-flex justify-content-end mt-4">
            {% csrf_token %}
            <a href="{{ cancel_url }}" class="btn btn-secondary mr-2">Cancelar</a>
            <button type="submit" class="btn btn-danger"><i class="fal fa-trash mr-1"></i> Sí, eliminar</button>
        </form>
    </div>
</div>
{% include 'master/includes/persona_edit_styles.html' %}
<script src="{% static 'js/vendors.bundle.js' %}"></script>
<script src="{% static 'js/app.bundle.js' %}"></script>
{% endblock %}
